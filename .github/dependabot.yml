version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-modules-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      # Keep breaking upgrades visible in their own reviewable pull request.
      go-modules-major:
        patterns:
          - "*"
        update-types:
          - "major"
